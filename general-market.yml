# Lola Marketplace Registry
#
# A curated catalog of Lola modules for AI assistants
#
# Add your module by submitting a PR! See CONTRIBUTING.md

marketplace:
  version: "1.0.0"
  description: "Curated registry of Lola modules"

categories:
  - name: "Module Development"
    description: "Tools for creating and managing modules"
    modules:
      - name: "lola-manager"
        repository: "https://github.com/mrbrandao/lola-manager"
        description: "Build Lola modules with workflow guidance"
        author: "Igor Brandao"
        version: "0.1.0"
        tags:
          - "module-builder"
          - "workflow"
          - "scaffolding"
        assistants:
          - "claude-code"
          - "cursor"
          - "gemini-cli"

  - name: "Learning & Examples"
    description: "Demonstrations and tutorials"
    modules:
      - name: "chef-buddy"
        repository: "https://github.com/mrbrandao/cheff-buddy"
        description: "Lazy context loading demonstration"
        author: "Igor Brandao"
        version: "0.1.0"
        tags:
          - "demo"
          - "lazy-loading"
          - "tutorial"
        assistants:
          - "cursor"

